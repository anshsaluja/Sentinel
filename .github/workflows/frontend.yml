name: Frontend build
on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
permissions:
  contents: read
jobs:
  angular:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Keycloak realm and API smoke probe contracts
        working-directory: .
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Run API transport regression tests
        run: npm test
      - name: Build Angular application
        run: npm run build
