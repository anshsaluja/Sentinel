name: Approval smoke probe tests
on:
  push:
    paths:
      - 'scripts/smoke_approval_api.py'
      - 'scripts/test_smoke_approval_api.py'
      - '.github/workflows/approval-smoke-tests.yml'
  pull_request:
    paths:
      - 'scripts/smoke_approval_api.py'
      - 'scripts/test_smoke_approval_api.py'
      - '.github/workflows/approval-smoke-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-probe-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run approval smoke probe regression tests
        run: python -m unittest discover -s scripts -p 'test_smoke_approval_api.py' -v
