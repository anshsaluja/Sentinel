name: Backend verification
on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-verify.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-verify.yml'
permissions:
  contents: read
jobs:
  maven:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/sentinel?replicaSet=rs0
      SENTINEL_OIDC_ISSUER_URI: http://localhost:8081/realms/sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Start and initialize MongoDB replica set
        run: |
          docker run -d --name sentinel-ci-mongo -p 127.0.0.1:27017:27017 mongo:7.0 mongod --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec sentinel-ci-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' 2>/dev/null | grep -qx 1; then
              break
            fi
            sleep 2
          done
          docker exec sentinel-ci-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec sentinel-ci-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -qx true; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB replica set did not elect a primary" >&2
          exit 1
      - name: Verify backend tests
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify
