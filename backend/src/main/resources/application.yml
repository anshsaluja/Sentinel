spring:
  application:
    name: sentinel
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/sentinel}
      auto-index-creation: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Set to the configured Keycloak realm issuer, e.g.
          # http://localhost:8081/realms/sentinel
          issuer-uri: ${SENTINEL_OIDC_ISSUER_URI:http://localhost:8081/realms/sentinel}
server:
  error:
    include-message: never
